<div class="container mt-5" *ngIf="food">

  <!-- TITLE + RATING -->
  <div class="row">
    <div class="col-sm-12 text-center">

      <h1 class="fw-bold">
        {{ food.name }}
      </h1>

      <h4 class="text-muted">
        {{ food.city || food.city }}
      </h4>

      <!-- Stars -->
      <div class="mt-2">
        <span *ngFor="let star of [].constructor(food.rating)">
          ⭐
        </span>
      </div>

    </div>
  </div>

  <!-- IMAGE + DESCRIPTION -->
  <div class="row mt-4">
    
    <!-- Image -->
    <div class="col-md-6 text-center mb-4">
      <img 
        [src]="food.image || 'assets/images/restaurant-default.jpg'"
        class="img-fluid rounded shadow"
        style="max-height:300px; object-fit:cover;"
      >
    </div>

    <!-- Description -->
    <div class="col-md-6">
      <h3>Description</h3>
      <p>{{ loremIpsum }}</p>
    </div>

  </div>

  <!-- MAP -->
  <div class="row mt-4">
    <div class="col-sm-12 text-center">
      <google-map height="400px" width="100%" [options]="map_options">
        <map-advanced-marker 
          *ngFor="let location of map_locations"
          [position]="{ lat: location.lat, lng: location.lng }">
        </map-advanced-marker>
      </google-map>
    </div>
  </div>

  <!-- WEATHER -->
  <div class="row mt-4 text-center">
    <div class="col-sm-12">
      <img *ngIf="weatherIconURL" [src]="weatherIconURL" width="120">
      <h4>{{ temperature }}°C</h4>
      <h5>{{ weather }}</h5>
    </div>
  </div>

  <!-- REVIEWS -->
  <div class="row mt-5">
    <div class="col-sm-12">

      <h3 class="mb-3">Customer Reviews</h3>

      <div *ngIf=" reviews_list.length === 0" class="text-muted">
        No reviews yet. Be the first to review!
      </div>

      <div class="card mb-3 shadow-sm" *ngFor="let review of  reviews_list.length">
        <div class="card-header fw-bold">
          {{ review.username }}
        </div>
        <div class="card-body">
          <p class="mb-2">{{ review.comment }}</p>

          <!-- Stars -->
          <span class="text-warning">
            <ng-container *ngFor="let s of [].constructor(review.star)">⭐</ng-container>
          </span>

        </div>
      </div>

    </div>
  </div>

</div>



<!-- REVIEW FORM -->
<div class="container mt-5">
  <div class="row">
    <div class="col-sm-12">

      <h2 class="mb-4">Write a Review</h2>

      <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()">

        <div class="form-group mb-3">
          <label>Username</label>
          <input 
            type="text" 
            class="form-control"
            formControlName="username"
            [ngClass]="{ 'is-invalid': isInvalid('username') }"
          >
        </div>

        <div class="form-group mb-3">
          <label>Your Review</label>
          <textarea 
            class="form-control"
            formControlName="comment"
            [ngClass]="{ 'is-invalid': isInvalid('comment') }"
            rows="3">
          </textarea>
        </div>

        <div class="form-group mb-3">
          <label>Rating</label>
          <select class="form-control" formControlName="stars">
            <option *ngFor="let s of [1,2,3,4,5]" [value]="s">
              {{ s }} stars
            </option>
          </select>
        </div>

        <button class="btn btn-primary px-4" type="submit">
          Submit Review
        </button>

      </form>

    </div>
  </div>
</div>
