<div class="filters row mb-3 mt-4 px-3">
  <!-- SEARCH BAR -->
  <div class="col-md-4 mb-2">
    <input
      type="text"
      class="form-control"
      placeholder="Search by name, city or country..."
      [(ngModel)]="searchQuery"
      (input)="applyFilters()"
    >
  </div>

  <!-- RATING FILTER -->
  <div class="col-md-3 mb-2">
    <select class="form-select" [(ngModel)]="minRating" (change)="applyFilters()">
      <option [ngValue]="null">All ratings</option>
      <option [ngValue]="5">5★ only</option>
      <option [ngValue]="4">4★ and above</option>
      <option [ngValue]="3">3★ and above</option>
    </select>
  </div>

  <!-- SORTING -->
  <div class="col-md-3 mb-2">
    <select class="form-select" [(ngModel)]="sortBy" (change)="applyFilters()">
      <option value="ratingDesc">Rating: High → Low</option>
      <option value="ratingAsc">Rating: Low → High</option>
      <option value="name">Name: A → Z</option>
    </select>
  </div>
</div>


<!-- FOOD CARDS -->
<div class="container mt-3">
  <div class="row">

    <div class="col-md-4 mb-4" *ngFor="let food of filteredFoods">
      <div class="card shadow-sm p-2 food-card"
           style="cursor: pointer;"
           [routerLink]="['/food', food._id]">

        <img
          [src]="food.image || 'assets/images/restaurant-default.jpg'"
          class="card-img-top"
          style="height: 180px; object-fit: cover;"
        >

        <div class="card-body">
          <h5 class="card-title">{{ food.name }}</h5>
          <p class="text-muted small">{{ food.city }}, {{ food.country }}</p>

          <!-- STAR RATING -->
          <div class="stars mb-2">
            <span *ngFor="let s of [].constructor(food.rating)">⭐</span>
          </div>

          <p>Popular in {{ food.city }}</p>
        </div>

        <div class="card-footer text-end">
          View Details →
        </div>

      </div>
    </div>

  </div>
</div>


<!-- PAGINATION CONTROLS -->
<div class="d-flex justify-content-between align-items-center mt-4 px-3">
  <button class="btn btn-outline-secondary"
          [disabled]="page === 1"
          (click)="previousPage()">
    ‹ Prev
  </button>

  <span>Page {{ page }} / {{ totalPages }}</span>

  <button class="btn btn-outline-secondary"
          [disabled]="page === totalPages"
          (click)="nextPage()">
    Next ›
  </button>
</div>
