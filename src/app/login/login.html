<!-- Background Image Wrapper -->
<div class="bg-wrapper">
  <img src="assets/images/1.jpg" class="bg-image" alt="Background">
</div>

<!-- Dark Mode Toggle -->
<div class="toggle-switch" (click)="toggleDarkMode()">
  <div class="switch">
    <div class="ball"></div>
    <span class="icon sun">☀️</span>
    <span class="icon moon">🌙</span>
  </div>
</div>

<!-- LOGIN FORM -->
<div class="login-container">
  <div class="login-card">

    <h2 class="title">Welcome Back</h2>
    <p class="subtitle">Please login to continue</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      <!-- Username -->
      <div class="input-group floating">
        <input type="text" [(ngModel)]="username" name="username" required placeholder=" " />
        <label>Email or Username</label>
        <i class="fa fa-user icon"></i>
      </div>

      <!-- Password -->
      <div class="input-group floating">
        <input [type]="showPassword ? 'text' : 'password'"
               [(ngModel)]="password" name="password"
               required placeholder=" " />

        <label>Password</label>
        <i class="fa fa-lock icon"></i>

        <i class="fa toggle-pass"
           [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
           (click)="showPassword = !showPassword"></i>
      </div>

      <!-- Options -->
      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          Remember me
        </label>
        <a class="forgot">Forgot Password?</a>
      </div>

      <!-- Login -->
      <button class="btn primary" [disabled]="!loginForm.valid">Login</button>

      <!-- Signup -->
      <div class="signup">
        Don’t have an account?
        <a routerLink="/signup">Create account</a>
      </div>

      <!-- Social Login Buttons -->
      <button class="btn social google">
        <img src="assets/images/icons/google.png" class="social-icon">
        Login with Google
      </button>

      <button class="btn social facebook">
        <img src="assets/images/icons/facebook.png" class="social-icon">
        Login with Facebook
      </button>

      <button class="btn social auth0" (click)="loginWithAuth0()">
        <img src="assets/images/icons/auth0.jpg" class="auth0-icon">
        Login with Auth0
      </button>

      <p class="message">{{ message }}</p>

    </form>
  </div>
</div>
