<!-- Dark Mode iOS Toggle Switch -->
<div class="toggle-switch" (click)="toggleDarkMode()">
  <div class="switch">
    <div class="ball"></div>
    <span class="icon sun">☀️</span>
    <span class="icon moon">🌙</span>
  </div>
</div>

<!-- Animated Background -->
<div class="animated-bg"></div>

<div class="login-container">
  <div class="login-card">

    <h2 class="title">Welcome Back</h2>
    <p class="subtitle">Please login to continue</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      <!-- Username -->
      <div class="input-group floating">
        <input type="text" [(ngModel)]="username" name="username" required placeholder=" " />
        <label>Email or Username</label>
        <i class="fa fa-user icon"></i>
      </div>

      <!-- Password -->
      <div class="input-group floating">
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          required
          placeholder=" "
        />
        <label>Password</label>
        <i class="fa fa-lock icon"></i>

        <i
          class="fa toggle-pass"
          [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
          (click)="showPassword = !showPassword"
        ></i>
      </div>

      <!-- Options -->
      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          Remember me
        </label>
        <a class="forgot" routerLink="/forgot-password">Forgot Password?</a>
      </div>

      <!-- Login button -->
      <button class="btn primary" [disabled]="!loginForm.valid">
        Login
      </button>

      <!-- Signup -->
      <div class="signup">
        Don’t have an account?
        <a routerLink="/signup">Create account</a>
      </div>

      <!-- Social Logins -->
      <div class="social-buttons">
        <button class="btn social google">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" />
          Login with Google
        </button>

        <button class="btn social facebook">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg" />
          Login with Facebook
        </button>
      </div>

      <!-- Auth0 -->
      <button type="button" class="btn auth0" (click)="loginWithAuth0()">
        <img src="https://cdn.auth0.com/styleguide/components/1.0.8/media/logos/img/badge.png" />
        Login with Auth0
      </button>

      <p class="message">{{ message }}</p>

    </form>
  </div>
</div>
