<div class="container" style="margin-top: 70px">
  <div class="row">
    <div class="col-sm-12">

      @for (food of food_list; track food.id) {
        <div class="card text-white bg-primary mb-3"
             style="cursor: pointer;"
             [routerLink]="['/foods', food.id]">
          <div class="card-header">
            {{ food.name }}
          </div>

          <div class="card-body">
            This food is popular in {{ food.town }}
          </div>

          <div class="card-footer">
            Click to see details → reviews, weather, map, etc.
          </div>
        </div>
      }

    </div>
  </div>

  <div class="row mt-3">
    <div class="col-sm-4">
      <button class="btn btn-primary" (click)="previousPage()">Previous</button>
    </div>

    <div class="col-sm-4 text-center align-self-center">
      Showing page {{ page }} of {{ foodData.getLastPageNumber() }}
    </div>

    <div class="col-sm-4 text-end">
      <button class="btn btn-primary" (click)="nextPage()">Next</button>
    </div>
  </div>

</div>
