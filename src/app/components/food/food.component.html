<div class="container" style="margin-top: 70px;">

  <div class="row">
    <div class="col-sm-12">
      <div class="display-1">
        {{ food.name }} of {{ food.town }}
      </div>

      <div class="mt-2">
        <span *ngFor="let star of [].constructor(food.rating)">
          <img src="../../../assets/images/star.png" style="width:30px;height:30px;">
        </span>
      </div>
    </div>
  </div>

  <div class="row">

    <div class="col-sm-6">
      <h3>Descriptions</h3>
      <p>{{ loremIpsum }}</p>

      <svg height="120" width="120">
        <circle [attr.fill]="temperatureColour" cx="60" cy="60" r="40"></circle>
        <text x="50%" y="50%" text-anchor="middle" dy=".3em">
          {{ temperature }}°C
        </text>
      </svg>

      <div class="mt-3">
        <img [src]="weatherIconURL" width="100">
        <br>
        <strong>Current weather: </strong>{{ weather }}
      </div>
    </div>

    <div class="col-sm-6">
      <google-map height="400px" width="100%" [options]="map_options">
        <map-advanced-marker [position]="{ lat: food.lat, lng: food.lng }"></map-advanced-marker>
      </google-map>
    </div>

  </div>

  <div class="row mt-5">
    <h3>Reviews</h3>

    <div class="col-sm-12">
      <div *ngFor="let review of food.reviews" class="card bg-light mb-3">
        <div class="card-header">{{ review.username }}</div>
        <div class="card-body">{{ review.comment }}</div>
        <div class="card-footer">Rating: {{ review.stars }}</div>
      </div>
    </div>
  </div>

</div>
