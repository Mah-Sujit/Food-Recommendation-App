<div class="admin-bg">
<div class="admin-page admin-container container">

  <!-- Header -->
  <div class="mb-5 text-center">
    <h2 class="fw-bold">
      <i class="bi bi-gear-fill me-2"></i> Admin – Manage Foods
    </h2>
  </div>

  <!-- Search + Sort + Add Button -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <!-- Search -->
    <input type="text"
           class="form-control w-25"
           placeholder="Search food..."
           [(ngModel)]="searchText"
           (input)="applySearch()">

    <!-- Sort -->
    <select class="form-select w-25" (change)="applySort($event)">
      <option value="">Sort by</option>
      <option value="name">Name (A-Z)</option>
      <option value="town">Town (A-Z)</option>
      <option value="rating">Rating (High to Low)</option>
    </select>

    <!-- Add Button -->
    <button class="btn btn-primary shadow-sm" (click)="openAddForm()">
      <i class="bi bi-plus-circle me-1"></i> Add New Food
    </button>

  </div>

  <!-- Food Table Card -->
  <div class="card shadow-sm mb-4">
    <div class="card-body p-0">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Town</th>
            <th>Rating</th>
            <th style="width: 180px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of foods">
            <td class="fw-semibold">{{ f.name }}</td>
            <td>{{ f.town }}</td>
            <td><span class="badge bg-success fs-6">⭐ {{ f.rating }}</span></td>
            <td>
              <button class="btn btn-sm btn-outline-secondary me-2" (click)="edit(f)">
                <i class="bi bi-pencil-fill"></i> Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(f)">
                <i class="bi bi-trash-fill"></i> Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="foods.length === 0" class="text-center text-muted p-3">
        No foods added yet.
      </p>
    </div>
  </div>

</div>

<!-- Add/Edit Food Modal -->
<div class="modal fade" id="foodModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">{{ isEditing ? 'Edit Food' : 'Add Food' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label fw-bold">Name</label>
          <input class="form-control" [(ngModel)]="selectedFood.name">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Town</label>
          <input class="form-control" [(ngModel)]="selectedFood.town">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Rating</label>
          <input type="number" min="0" max="5" class="form-control" [(ngModel)]="selectedFood.rating">
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" (click)="saveFood()">Save</button>
      </div>

    </div>
  </div>
</div>
</div>
