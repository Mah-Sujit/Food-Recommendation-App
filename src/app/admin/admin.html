<div class="container mt-5">
  <h2 class="mb-4">Admin – Manage Foods</h2>

  <button class="btn btn-primary mb-3" (click)="openAddForm()">
    + Add New Food
  </button>

  <!-- Table -->
  <div class="table-responsive mb-4">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Town</th>
          <th>Rating</th>
          <th style="width: 180px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of foods">
          <td>{{ f.name }}</td>
          <td>{{ f.town }}</td>
          <td>{{ f.rating }}</td>
          <td>
            <button class="btn btn-sm btn-outline-secondary me-2" (click)="edit(f)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(f)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="foods.length === 0" class="text-muted">
      No foods found.
    </p>
  </div>

  <!-- Add/Edit Form -->
  <div *ngIf="showForm" class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title">
        {{ isEditing ? 'Edit Food' : 'Add Food' }}
      </h5>

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" [(ngModel)]="selectedFood.name">
      </div>

      <div class="mb-3">
        <label class="form-label">Town</label>
        <input class="form-control" [(ngModel)]="selectedFood.town">
      </div>

      <div class="mb-3">
        <label class="form-label">Rating</label>
        <input type="number" min="0" max="5" class="form-control" [(ngModel)]="selectedFood.rating">
      </div>

      <button class="btn btn-success me-2" (click)="saveFood()">Save</button>
      <button class="btn btn-outline-secondary" (click)="cancelForm()">Cancel</button>
    </div>
  </div>
</div>
