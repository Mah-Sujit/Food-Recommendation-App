<div class="signup-page">

  <div class="signup-card animate">

    <h2>Create Your Account</h2>
    <p class="subtitle">Join our Food Recommendation App</p>

    <form (ngSubmit)="signUp()">

      <!-- Full Name -->
      <div class="input-group">
        <input 
          type="text" 
          placeholder="Full Name" 
          [(ngModel)]="form.username" 
          name="username" 
          required
        >
      </div>

      <!-- Email -->
      <div class="input-group">
        <input 
          type="email" 
          placeholder="Email Address" 
          [(ngModel)]="form.email" 
          name="email" 
          required
        >
      </div>

      <!-- Password -->
      <div class="input-group">
        <input 
          type="password" 
          placeholder="Password" 
          [(ngModel)]="form.password" 
          name="password" 
          required
        >
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <input 
          type="password" 
          placeholder="Confirm Password" 
          [(ngModel)]="form.confirm" 
          name="confirm" 
          required
        >
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn signup-btn">
        Sign Up
      </button>

    </form>

    <p class="login-link">
      Already have an account? <a routerLink="/login">Login</a>
    </p>

  </div>

  <!-- POPUP MESSAGE -->
  <div class="toast-message" [class.show]="toastVisible" [class.success]="toastSuccess">
    {{ toastMessage }}
  </div>

</div>
